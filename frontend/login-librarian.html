<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Sign In · Library Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="toprail" style="background:var(--oxblood);">Library Management System · <em>Staff Area</em> · Authorized personnel only</div>

  <div class="login-wrap">
    <div class="login-card">
      <div class="ornament" style="color:var(--oxblood);">✦</div>
      <h1>Staff Sign In</h1>
      <p class="tagline">Librarian Access</p>

      <form action="admin.html" method="get">
        <label class="field">
          <span class="lbl">Staff Email</span>
          <input type="email" name="email" placeholder="you@library.org" required autocomplete="email">
        </label>
        <label class="field">
          <span class="lbl">Password</span>
          <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </label>
        <button type="submit" class="btn block">Sign In</button>
      </form>

      <p class="foot">
        Staff accounts are issued by the library administrator.<br><br>
        <a href="index.html">&larr; Back</a> &nbsp;·&nbsp; <a href="login-member.html">Not staff? Member sign in</a>
      </p>
    </div>
  </div>

</body>
</html>
