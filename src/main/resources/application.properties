spring.application.name=library-management-system

# --- Local development: SQLite in a file next to the app -----------------------
# Zero setup, but ephemeral on a hosting platform. Production overrides all of
# this in application-prod.properties.
spring.datasource.url=jdbc:sqlite:library.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# SQLite serializes writes, so a wide pool buys nothing and invites lock errors.
spring.datasource.hikari.maximum-pool-size=1

# Hibernate creates and alters tables from the entities as they change. Fine for
# development; production runs `validate` instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Templates ----------------------------------------------------------------
spring.thymeleaf.cache=false

# --- First librarian ------------------------------------------------------------
# Created at startup if no LIBRARIAN account exists. Development defaults —
# production overrides with LIBRARY_LIBRARIAN_EMAIL / LIBRARY_LIBRARIAN_PASSWORD.
library.librarian.email=librarian@library.local
library.librarian.password=changeme123
