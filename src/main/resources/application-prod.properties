# Production: managed PostgreSQL. Activate with SPRING_PROFILES_ACTIVE=prod.
#
# Every value here comes from the environment. No credential belongs in this
# file or anywhere else in the repository.

spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# `validate` fails startup on a schema mismatch rather than silently altering the
# production database. Promote schema changes deliberately.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.thymeleaf.cache=true

# PaaS platforms inject the port to bind.
server.port=${PORT:8080}
