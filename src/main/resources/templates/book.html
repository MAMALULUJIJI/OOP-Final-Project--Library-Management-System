<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head(${book.title})}"></head>
<body>

  <th:block th:replace="~{fragments :: member-chrome('catalog')}"></th:block>

  <main class="page">

    <th:block th:replace="~{fragments :: flash}"/>

    <div class="detail">

      <div>
        <div class="cover" style="background:#92a7ba;">
          <div class="c-top">Library Collection</div>
          <div class="c-title" th:text="${book.title}">Title</div>
          <div class="c-author" th:text="${book.author}">Author</div>
        </div>
      </div>

      <div class="d-body">
        <p class="kicker" style="font-size:11px; letter-spacing:0.34em; text-transform:uppercase; color:var(--brass); margin-bottom:10px;"
           th:text="${book.category} ?: 'Uncategorized'">Category</p>
        <h2 th:text="${book.title}">Title</h2>
        <p class="d-author" th:text="${book.author}">Author</p>

        <!-- What the shelf offers *this* viewer: shelved copies minus
             copies reserved for READY waitlist holds. -->
        <span class="avail" style="font-size:14px;"
              th:classappend="${effectiveAvailable == 0} ? 'out' : (${effectiveAvailable == 1} ? 'low' : 'in')">
          <span class="dot"></span>
          <th:block th:if="${effectiveAvailable > 0}"
                    th:text="${effectiveAvailable} + ' of ' + ${book.totalCopies} + ' on the shelf'"></th:block>
          <th:block th:if="${effectiveAvailable == 0 && book.availableCopies > 0}">Remaining copies held for the waitlist</th:block>
          <th:block th:if="${book.availableCopies == 0}">All copies on loan</th:block>
        </span>

        <dl class="specs">
          <dt>ISBN</dt><dd class="isbn" style="font-size:13px;" th:text="${book.isbn}">ISBN</dd>
          <dt>Category</dt><dd th:text="${book.category} ?: 'Uncategorized'">Category</dd>
          <dt>Copies</dt><dd th:text="${effectiveAvailable} + ' of ' + ${book.totalCopies} + ' available'">0 of 0</dd>
          <dt>Loan period</dt>
          <dd th:text="${loanDays} + ' days from date of borrowing'">14 days from date of borrowing</dd>
        </dl>

        <!-- Signed in: the one button that applies right now. A READY hold
             beats everything; otherwise borrow if the shelf allows, else
             join (or stand in) the waitlist. -->
        <div sec:authorize="isAuthenticated()" style="display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:22px;">

          <form th:if="${readyHold != null}" th:action="@{/books/{id}/borrow(id=${book.id})}" method="post">
            <button class="btn" type="submit">Borrow Now &mdash; a copy is held for you</button>
          </form>

          <form th:if="${readyHold == null && effectiveAvailable > 0}"
                th:action="@{/books/{id}/borrow(id=${book.id})}" method="post">
            <button class="btn" type="submit">Borrow This Book</button>
          </form>

          <th:block th:if="${readyHold == null && effectiveAvailable == 0}">
            <th:block th:if="${activeEntry != null}">
              <span class="badge pos" th:text="'You are #' + ${position} + ' in line'">#1 in line</span>
              <form th:action="@{/waitlist/{id}/cancel(id=${activeEntry.id})}" method="post">
                <button class="btn danger small" type="submit">Leave the Waitlist</button>
              </form>
            </th:block>
            <form th:if="${activeEntry == null}" th:action="@{/books/{id}/waitlist(id=${book.id})}" method="post">
              <button class="btn brass" type="submit">Join the Waitlist</button>
            </form>
          </th:block>

        </div>

        <div sec:authorize="!isAuthenticated()" style="margin-top:22px;">
          <a class="btn" th:href="@{/login}"
             th:text="${effectiveAvailable > 0} ? 'Sign in to borrow' : 'Sign in to join the waitlist'">Sign in to borrow</a>
        </div>

      </div>
    </div>
  </main>

  <th:block th:replace="~{fragments :: footer('❦')}"></th:block>

</body>
</html>
