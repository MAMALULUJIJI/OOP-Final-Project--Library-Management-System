# Tests get their own throwaway database under target/, so running the suite
# never touches the development library.db.
spring.datasource.url=jdbc:sqlite:target/test.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# This file *replaces* the main application.properties on the test classpath,
# so the seeder's credentials must be restated. SecurityAccessTest signs in
# with these.
library.librarian.email=librarian@library.local
library.librarian.password=changeme123
